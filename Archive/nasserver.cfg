
[SVN_Repo]
interface = sftp_interface
hostname = artimus-server.local
username = artimus
#authentication = public_key
port = 22
source_folder = /mnt/datadisk1/share1
destin_folder = /mnt/filerepo/artimus_files
items: ${source_folder}/programming/basata_svn => ${destin_folder}/programming/basata_svn
       ${source_folder}/Documents => ${destin_folder}/Documents/
       ${source_folder}/linux_programs => ${destin_folder}/linux_programs
selection = recent only
copy_mode = replace

[GLOBAL SETTINGS]
batch_mode = sequential
debug_level = 2

