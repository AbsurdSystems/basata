
[Devbox_Repo]
interface = sftp_interface
hostname = d0gbert-devbox.local
username = d0gbert
authentication = public_key
port = 22
source_folder = ~
destin_folder = .
items: ${source_folder}/Documents/Documentation => ${destin_folder}/Documents/Documentation
       ${source_folder}/Documents/Console_Roms => ${destin_folder}/Documents/Console_Roms
