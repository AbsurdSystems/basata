
[Macbook_Repo]
source1_folder = ~
source2_folder = /mnt/sharedisk1/share1
destin_folder = /media/usbdisks/datadisk1/share1
items: ${source2_folder}/Documents => ${destin_folder}/Documents/
       ${source1_folder}/Videos/Movies => ${destin_folder}/Media/Videos/Movies
       ${source1_folder}/Videos/TV_Shows => ${destin_folder}/Media/Videos/TV_Shows
       ${source1_folder}/Videos/Music_Videos => ${destin_folder}/Media/Videos/Music_Videos
       ${source2_folder}/Pictures => ${destin_folder}/Media/Pictures
       ${source2_folder}/Music => ${destin_folder}/Media/Music
       ${source2_folder}/Podcasts => ${destin_folder}/Media/Podcasts
       ${source2_folder}/New_Podcasts => ${destin_folder}/Media/New_Podcasts
       ${source2_folder}/programming => ${destin_folder}/programming
       ${source2_folder}/disk_images => ${destin_folder}/disk_images
       ${source2_folder}/minecraft_backups => ${destin_folder}/backups/minecraft_backups
       ${source2_folder}/windows_programs => ${destin_folder}/windows_programs
       ${source2_folder}/linux_programs => ${destin_folder}/linux_programs
#       ${source2_folder}/wikipedia => ${destin_folder}/backups/wikipedia
       ${source2_folder}/kiwix_zim_files => ${destin_folder}/Media/ZIM_Files
selection = recent only
copy_mode = replace

[GLOBAL SETTINGS]
batch_mode = sequential
debug_level = 2

