
[Macbook_Repo]
interface = sftp_interface
hostname = d0gbert-server.local
username = d0gbert
#authentication = public_key
port = 22
source_folder = /mnt/sharedisk1/share1
destin_folder = /mnt/maindata/d0gbert_files
items: ${source_folder}/Documents => ${destin_folder}/Documents/
       ${source_folder}/Videos/Movies => ${destin_folder}/Media/Videos/Movies
       ${source_folder}/Videos/TV_Shows => ${destin_folder}/Media/Videos/TV_Shows
       ${source_folder}/Videos/Music_Videos => ${destin_folder}/Media/Videos/Music_Videos
       ${source_folder}/Pictures => ${destin_folder}/Media/Pictures
       ${source_folder}/Music => ${destin_folder}/Media/Music
       ${source_folder}/Podcasts => ${destin_folder}/Media/Podcasts
       ${source_folder}/programming => ${destin_folder}/programming
       ${source_folder}/Console_Roms => ${destin_folder}/disk_images/console_roms
selection = recent only
copy_mode = replace

[GLOBAL SETTINGS]
batch_mode = sequential
debug_level = 2

