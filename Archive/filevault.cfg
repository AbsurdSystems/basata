
[Devbox_Repo]
interface = sftp_interface
hostname = artimus-devbox.local
username = artimus
#authentication = public_key
port = 22
source_folder = /media/artimus/foreverdrive/filevault
destin_folder = /mnt/sharedisk1/share1
items: ${source_folder}/Documents/Documentation => ${destin_folder}/Documents/Documentation
       ${source_folder}/Documents/Book_PDFs => ${destin_folder}/Documents/Book_PDFs
       ${source_folder}/programming/basata_svn => ${destin_folder}/programming/basata_svn
       ${source_folder}/kiwix_zim_files => ${destin_folder}/kiwix_zim_files
       ${source_folder}/wikipedia => ${destin_folder}/wikipedia
       ${source_folder}/Music => ${destin_folder}/Music
       ${source_folder}/disk_iso => ${destin_folder}/disk_images/disk_iso
selection = recent only
copy_mode = replace

[GLOBAL SETTINGS]
batch_mode = sequential
debug_level = 2

